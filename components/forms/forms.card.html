<div id="root"></div>
<script type="text/babel">
const { TextField, MicButton } = window.Lateralus;
function Demo() {

      <div className="row">
        <TextField variant="search" placeholder="Search your journal" style={{width:260}} />
      </div>
      <div className="row">
        <TextField variant="editor" value="A paperclip could hold a tiny sail for a boat made of..." wordCount={9} style={{width:340}} />

          <MicButton state="idle" />
          <MicButton state="recording" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
