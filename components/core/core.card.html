<!-- @dsCard group="Components" viewport="700x520" name="Core" subtitle="GlassCard, Button, IconButton, Badge, StreakPill, EmptyState" -->
<html><head>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:linear-gradient(180deg,var(--bg-sky-1),var(--bg-sky-3));padding:24px;font-family:var(--font-ui)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { GlassCard, Button, IconButton, Badge, StreakPill, EmptyState } = window.Lateralus;
function Demo() {
  return (
    <div>
      <div className="row">
        <Button variant="primary" icon="ph-check">Save to Journal</Button>
        <Button variant="secondary">Answer again</Button>
        <Button variant="ghost">Skip</Button>
        <Button variant="danger">Delete</Button>
        <Button variant="primary" disabled>Begin</Button>
      </div>
      <div className="row">
        <IconButton icon="ph-x" />
        <IconButton icon="ph-dice-five" />
        <IconButton icon="ph-star" active />
        <StreakPill days={12} />
        <Badge kind="daily">Daily</Badge>
        <Badge kind="favorite">Favorite</Badge>
        <Badge kind="success">Saved</Badge>
      </div>
      <div className="row" style={{gap:16}}>
        <GlassCard style={{width:220}}>
          <div style={{font:'var(--text-title)',color:'var(--text-primary)',marginBottom:6}}>Default</div>
          <div style={{font:'var(--text-body)',color:'var(--text-secondary)'}}>Journal row card</div>
        </GlassCard>
        <GlassCard variant="raised" glow="var(--type-reality-1)" style={{width:220}}>
          <div style={{font:'var(--text-title)',color:'var(--text-primary)',marginBottom:6}}>Raised + glow</div>
          <div style={{font:'var(--text-body)',color:'var(--text-secondary)'}}>Daily / hero card</div>
        </GlassCard>
      </div>
      <EmptyState icon="ph-notebook" title="No ideas yet" body="Your saved answers will show up here." />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
